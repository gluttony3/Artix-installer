<!DOCTYPE html>
<html lang="{{ lang }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Artix Installer{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a class="brand" href="/">Artix Installer</a>

            <ul class="nav-links">
                <li><a href="/">{{ nav.home }}</a></li>
                <li><a href="/problems">{{ nav.problems }}</a></li>
                <li><a href="/artix">{{ nav.artix }}</a></li>
                <li><a href="https://github.com/gluttony3/Artix-installer">GitHub</a></li>
            </ul>

            <div class="lang-switcher">
                {% for code, name in languages.items() %}
                <a href="/set_lang/{{ code }}"
                    class="lang-link{% if lang == code %} active{% endif %}" title="{{ name }}">{{ language_flags[code] }}</a>
                {% endfor %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container">
        <p>Artix Linux installer site.</p>
    </footer>
</body>

</html>
